<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Subtle ambient glow -->
  <circle cx="200" cy="150" r="300" fill="#10b981" opacity="0.08" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="350" fill="#047857" opacity="0.06" filter="blur(80px)" />

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="80" height="80" rx="20" fill="url(#brandGrad)" />
    <text x="40" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">W</text>
  </g>
  
  <text x="200" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#ffffff">WorkForge</text>
  <text x="405" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#10b981" letter-spacing="3">MARKETPLACE</text>

  <!-- Main Headline -->
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#ffffff">
    How work should work.
  </text>

  <!-- Tagline -->
  <text x="100" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">
    Hire top 1% independent talent or discover high-paying freelance projects
  </text>
  <text x="100" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">
    with protected milestone escrow payments.
  </text>

  <!-- Badges -->
  <g transform="translate(100, 470)">
    <!-- Escrow Protection Badge -->
    <rect width="260" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="25" r="10" fill="#10b981" />
    <text x="48" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#f1f5f9">Milestone Escrow Protection</text>

    <!-- Verified Talent Badge -->
    <rect x="280" width="220" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="308" cy="25" r="10" fill="#10b981" />
    <text x="328" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#f1f5f9">Top 1% Verified Talent</text>

    <!-- Instant Payouts -->
    <rect x="520" width="210" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="548" cy="25" r="10" fill="#10b981" />
    <text x="568" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#f1f5f9">Global Card / UPI MoR</text>
  </g>
</svg>
